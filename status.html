<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Management Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px 10px; background: #f0f4f8; color: #1e293b; margin: 0; }
        .card { background: #ffffff; border-radius: 12px; padding: 20px 16px; max-width: 440px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #cbd5e1; box-sizing: border-box; }
        .title { font-size: 15pt; font-weight: bold; color: #0284c7; text-transform: uppercase; margin-bottom: 4px; }
        .subtitle { font-size: 8.5pt; color: #64748b; margin-bottom: 16px; }
        
        .info-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px; text-align: left; margin-bottom: 16px; font-size: 9pt; color: #334155; line-height: 1.6; }
        
        .pass-box { margin-bottom: 15px; padding: 10px; background: #fffbe3; border: 1px solid #ffe58f; border-radius: 6px; }
        .pass-input { width: 100%; padding: 10px; font-size: 11pt; text-align: center; letter-spacing: 2px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; margin-top: 6px; }
        .btn-pass { margin-top: 8px; width: 100%; padding: 10px; background: #0284c7; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .btn { display: block; padding: 12px; text-decoration: none; font-weight: bold; border-radius: 6px; font-size: 9.5pt; color: white; border: none; cursor: pointer; text-align: center; transition: transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        
        .btn-pdf-dl { background-color: #7c3aed; }
        .btn-approve { background-color: #16a34a; }
        .btn-forward { background-color: #0284c7; }
        .btn-reject { background-color: #dc2626; }

        #pdfRenderPaper { display: none; text-align: left; background: #fff; color: #000; padding: 15px; border: 1.5px solid #2d3748; font-size: 9pt; line-height: 1.4; }
        #pdfRenderPaper table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        #pdfRenderPaper th, #pdfRenderPaper td { border: 1px solid #cbd5e0; padding: 6px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <div class="title">Blockbuster Cineplexes</div>
    <div class="subtitle">Leave Approval & Review Portal</div>

    <div class="info-box">
        <b>Staff Name:</b> <span id="dispStaff">-</span><br>
        <b>Branch:</b> <span id="dispBranch">-</span><br>
        <b>Application Date:</b> <span id="dispDate">-</span><br>
        <b>Reason:</b> <span id="dispReason">-</span><br>
        <b>Portal Access:</b> <span id="dispRole" style="color: #0284c7; font-weight: bold;">-</span>
    </div>

    <!-- Password Verification Section -->
    <div id="authSection" class="pass-box">
        <label style="font-size: 8.5pt; font-weight: bold; color: #856404;">🔒 Manager Security Verification:</label>
        <input type="password" id="passInput" class="pass-input" placeholder="Enter PIN / Password">
        <button class="btn-pass" onclick="verifyPassword()">Unlock Portal</button>
        <p id="errorMsg" style="color: #dc2626; font-size: 8pt; margin: 6px 0 0 0; display: none;">Wrong Password! Unauthorized Access.</p>
    </div>

    <!-- Action Buttons (Hidden until Password Entry) -->
    <div id="actionArea" class="btn-group" style="display: none;"></div>
</div>

<div id="pdfRenderPaper">
    <div style="text-align: center; border-bottom: 2px solid #2d3748; padding-bottom: 8px; margin-bottom: 12px;">
        <h3 style="margin:0; font-size: 16pt; text-transform: uppercase;">Blockbuster Cineplexes</h3>
        <h5 style="margin:0; color: #dc2626; letter-spacing: 1px;">LEAVE APPLICATION FORM</h5>
    </div>
    <p><b>Branch:</b> <span id="pdfBranch"></span> | <b>Date:</b> <span id="pdfDate"></span></p>
    <p><b>Staff Name:</b> <span id="pdfStaff"></span> | <b>ID:</b> <span id="pdfID"></span></p>
    <p><b>Contact No:</b> <span id="pdfTel"></span></p>
    <p><b>Address While Leave:</b> <span id="pdfAddr"></span></p>
    <p><b>Reason:</b> <span id="pdfReason"></span></p>
    
    <table>
        <thead>
            <tr>
