<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockbuster Cineplexes - Leave Application Form</title>
    <!-- html2pdf.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .action-buttons {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-pdf { background-color: #28a745; color: white; }
        .btn-clear { background-color: #dc3545; color: white; }
        
        /* PDF Form Container */
        #leave-form-container {
            width: 800px;
            background: #fff;
            padding: 30px;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .header h3 {
            margin: 0;
            color: #d9534f;
            letter-spacing: 2px;
        }
        .header h2 {
            margin: 5px 0 0;
            color: #0056b3;
            font-size: 18px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 5px;
            color: #333;
        }
        input[type="text"], input[type="date"], select, textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
        }
        textarea {
            resize: vertical;
            height: 60px;
        }
        
        /* Leave Table */
        .leave-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            margin-bottom: 20px;
        }
        .leave-table th, .leave-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        .leave-table th {
            background-color: #e9ecef;
            color: #0056b3;
            font-size: 12px;
        }
        .leave-table td:nth-child(1) {
            text-align: left;
            font-weight: bold;
            font-size: 13px;
        }
        
        /* Signature & Footer */
        .footer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .signature-box {
            border: 1px dashed #aaa;
            height: 100px;
            position: relative;
            background: #fafafa;
        }
        canvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Print Media Styling */
        @media print {
            .action-buttons { display: none; }
            #leave-form-container { border: none; box-shadow: none; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="action-buttons">
        <button class="btn btn-pdf" onclick="generatePDF()">Download PDF</button>
        <button class="btn btn-clear" onclick="clearForm()">Reset Form</button>
    </div>

    <div id="leave-form-container">
        <div class="header">
            <small style="float: right; color: #666; font-size: 10px;">Ref: Blockbuster Cineplexes/HR/02</small>
            <h3>BLOCKBUSTER</h3>
            <p style="margin: 2px 0; font-size: 11px; font-weight: bold; color: #d9534f;">CINEPLEXES</p>
            <h2>LEAVE APPLICATION FORM</h2>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label>Branch / Location:</label>
                <select id="branch">
                    <option value="">-- Select Branch --</option>
                    <option value="Perling Mall" selected>Perling Mall</option>
                    <option value="Kluang Mall">Kluang Mall</option>
                </select>
            </div>
            <div class="form-group">
                <label>Application Date:</label>
                <input type="date" id="appDate">
            </div>
            <div class="form-group">
                <label>Select Staff Name:</label>
                <select id="staffName" onchange="updateEmpId()">
                    <option value="">-- Select Staff --</option>
                    <option value="George">George</option>
                    <option value="Ainaa">Ainaa</option>
                </select>
            </div>
            <div class="form-group">
                <label>Employee ID:</label>
                <input type="text" id="empId" placeholder="Auto-filled" readonly>
            </div>
            <div class="form-group">
                <label>Contact Phone:</label>
                <input type="text" id="phone" placeholder="e.g. 012-3456789">
            </div>
            <div class="form-group">
                <label>Reason for Leave:</label>
                <input type="text" id="reason" placeholder="State reason">
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
            <label>Address While on Leave:</label>
            <textarea id="address" placeholder="Address..."></textarea>
        </div>

        <table class="leave-table">
            <thead>
                <tr>
                    <th>TYPE</th>
                    <th>FROM</th>
                    <th>TO</th>
                    <th>DAYS</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input type="checkbox" class="leave-type"> Annual</td>
                    <td><input type="date" class="from-date" onchange="calculateDays(this)"></td>
                    <td><input type="date" class="to-date" onchange="calculateDays(this)"></td>
                    <td><input type="text" class="days-count" value="0" readonly style="text-align: center;"></td>
                </tr>
                <tr>
                    <td><input type="checkbox" class="leave-type"> Medical</td>
                    <td><input type="date" class="from-date" onchange="calculateDays(this)"></td>
                    <td><input type="date" class="to-date" onchange="calculateDays(this)"></td>
                    <td><input type="text" class="days-count" value="0" readonly style="text-align: center;"></td>
                </tr>
                <tr>
                    <td><input type="checkbox" class="leave-type"> Emergency</td>
                    <td><input type="date" class="from-date" onchange="calculateDays(this)"></td>
                    <td><input type="date" class="to-date" onchange="calculateDays(this)"></td>
                    <td><input type="text" class="days-count" value="0" readonly style="text-align: center;"></td>
                </tr>
                <tr>
                    <td><input type="checkbox" class="leave-type"> Other Leave</td>
                    <td><input type="date" class="from-date" onchange="calculateDays(this)"></td>
                    <td><input type="date" class="to-date" onchange="calculateDays(this)"></td>
                    <td><input type="text" class="days-count" value="0" readonly style="text-align: center;"></td>
                </tr>
            </tbody>
        </table>

        <div class="footer-grid">
            <div class="form-group">
                <label>Signature:</label>
                <div class="signature-box">
                    <canvas id="sig-canvas"></canvas>
                </div>
                <button type="button" style="margin-top: 5px; font-size: 10px;" onclick="clearSignature()">Clear Signature</button>
            </div>
            <div class="form-group">
                <label>Re-joining Date:</label>
                <input type="date" id="rejoiningDate">
            </div>
        </div>
    </div>

    <script>
        // Set today's date by default
        document.getElementById('appDate').valueAsDate = new Date();

        // Auto-fill Employee ID based on Selection
        function updateEmpId() {
            const staff = document.getElementById('staffName').value;
            const empIdInput = document.getElementById('empId');
            if (staff === "George") empIdInput.value = "EMP-001";
            else if (staff === "Ainaa") empIdInput.value = "EMP-002";
            else empIdInput.value = "";
        }

        // Calculate days logic
        function calculateDays(element) {
            const row = element.closest('tr');
            const from = row.querySelector('.from-date').value;
            const to = row.querySelector('.to-date').value;
            const daysInput = row.querySelector('.days-count');

            if (from && to) {
                const d1 = new Date(from);
                const d2 = new Date(to);
                const diffTime = d2 - d1;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
                daysInput.value = diffDays > 0 ? diffDays : 0;
            }
        }

        // Signature Canvas Logic
        const canvas = document.getElementById('sig-canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        canvas.addEventListener('mousedown', () => drawing = true);
        canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
        canvas.addEventListener('mousemove', draw);

        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000';
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function clearSignature() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // CRITICAL: Synchronize DOM values before PDF generation
        function syncDOMValues() {
            const container = document.getElementById('leave-form-container');

            // Synchronize Input Values
            container.querySelectorAll('input').forEach(input => {
                if (input.type === 'checkbox' || input.type === 'radio') {
                    if (input.checked) {
                        input.setAttribute('checked', 'checked');
                    } else {
                        input.removeAttribute('checked');
                    }
                } else {
                    input.setAttribute('value', input.value);
                }
            });

            // Synchronize Select Dropdowns
            container.querySelectorAll('select').forEach(select => {
                const selectedOption = select.options[select.selectedIndex];
                Array.from(select.options).forEach(opt => opt.removeAttribute('selected'));
                if (selectedOption) {
                    selectedOption.setAttribute('selected', 'selected');
                }
            });

            // Synchronize Textareas
            container.querySelectorAll('textarea').forEach(textarea => {
                textarea.innerHTML = textarea.value;
            });
        }

        // Generate PDF
        function generatePDF() {
            // 1. Sync values to HTML DOM attributes
            syncDOMValues();

            // 2. Generate PDF using html2pdf
            const element = document.getElementById('leave-form-container');
            const opt = {
                margin:       [0.3, 0.3, 0.3, 0.3],
                filename:     'Leave_Application_Form.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, logging: false, useCORS: true },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }

        function clearForm() {
            document.querySelectorAll('input[type="text"], input[type="date"], textarea').forEach(i => i.value = '');
            document.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
            document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
            clearSignature();
        }
    </script>
</body>
</html>
