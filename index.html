<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockbuster Cineplexes - Leave Application Form</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f4f8; margin: 0; padding: 12px 8px; color: #1e293b; }
    
    .paper { background: #ffffff; width: 100%; max-width: 650px; margin: 0 auto; padding: 14px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #cbd5e1; }
    .form-container { width: 100%; border: 1px solid #94a3b8; padding: 10px; border-radius: 8px; background: #ffffff; }
    .header { text-align: center; border-bottom: 2px solid #0284c7; padding-bottom: 6px; margin-bottom: 10px; }
    .doc-ref { font-size: 7.5pt; color: #64748b; }
    .logo-title { font-size: 18pt; font-weight: 800; color: #0284c7; text-transform: uppercase; margin: 0; letter-spacing: 1px; }
    .logo-sub { font-size: 8pt; font-weight: bold; letter-spacing: 2px; color: #dc2626; text-transform: uppercase; }
    .form-title { font-size: 10.5pt; font-weight: bold; margin-top: 6px; background: #f1f5f9; color: #0f172a; padding: 4px; text-transform: uppercase; letter-spacing: 1px; border-radius: 4px; border: 1px solid #cbd5e1; }
    
    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 8.5pt; font-weight: 600; margin-bottom: 4px; color: #334155; }
    
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    .col { flex: 1; min-width: 130px; }
    
    input[type="text"], input[type="date"], input[type="number"], select, textarea {
        width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 9pt; font-family: inherit; background: #f8fafc; color: #0f172a; box-sizing: border-box; transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: #0284c7; outline: none; background: #ffffff; box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2); }
    textarea { resize: vertical; min-height: 42px; }
    
    .table-responsive { width: 100%; overflow-x: auto; margin: 8px 0; -webkit-overflow-scrolling: touch; }
    table.leave-table, table.approved-table { width: 100%; border-collapse: collapse; min-width: 300px; }
    table.leave-table th, table.leave-table td, table.approved-table th, table.approved-table td { border: 1px solid #cbd5e1; padding: 5px 4px; text-align: center; font-size: 8.5pt; }
    table.leave-table th, table.approved-table th { background: #e2e8f0; color: #0284c7; font-weight: bold; }
    
    canvas#sigCanvas { border: 1px dashed #94a3b8; background-color: #f8fafc; cursor: crosshair; touch-action: none; width: 100%; height: 70px; border-radius: 6px; }
    .btn-clear { font-size: 8pt; padding: 3px 8px; background: #ef4444; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-top: 3px; font-weight: bold; }
    
    .attached-preview { margin-top: 8px; border: 1px dashed #94a3b8; padding: 6px; text-align: center; background: #f8fafc; border-radius: 6px; }
    .attached-preview img { max-width: 100%; max-height: 150px; display: none; margin: 4px auto 0 auto; border-radius: 4px; }

    .approved-section { 
        margin-top: 12px; 
        border-top: 2px dashed #0284c7; 
        padding-top: 8px; 
        text-align: left; 
    }
    .approved-title { font-size: 9pt; font-weight: bold; color: #16a34a; margin-bottom: 6px; text-transform: uppercase; }

    .app-footer { width: 100%; max-width: 650px; margin: 12px auto; background: #ffffff; padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #cbd5e1; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
    .btn { color: white; border: none; padding: 12px 16px; font-size: 9.5pt; font-weight: bold; border-radius: 6px; cursor: pointer; flex: 1; min-width: 140px; transition: transform 0.1s; text-decoration: none; display: inline-block; }
    .btn:active { transform: scale(0.98); }
    .btn-wa { background-color: #16a34a; }
    .btn-pdf { background-color: #dc2626; }
    .btn-apk { background-color: #0284c7; width: 100%; margin-top: 10px; }

    @media print {
        .app-footer, .btn-clear, .approved-section { display: none !important; }
        .paper { box-shadow: none; padding: 0; background: #fff; color: #000; }
        .form-container { background: #fff; border-color: #000; }
        input, select, textarea { background: #fff !important; color: #000 !important; border-color: #ccc !important; }
    }
</style>
</head>
<body>

<div class="paper" id="formPaper">
    <div class="form-container">
        <div class="header">
            <div class="doc-ref">Ref: Blockbuster Cineplexes / HR / 02</div>
            <div class="logo-title">Blockbuster</div>
            <div class="logo-sub">Cineplexes</div>
            <div class="form-title">Leave Application Form</div>
        </div>

        <div class="row">
            <div class="col form-group">
                <label>Branch / Location:</label>
                <select id="cinemaBranch" onchange="updateStaffList()">
                    <option value="Perling Mall">Perling Mall</option>
                    <option value="Pelangi Leisure Mall">Pelangi Leisure Mall</option>
                </select>
            </div>
            <div class="col form-group">
                <label>Application Date:</label>
                <input type="date" id="applyDate">
            </div>
        </div>

        <div class="row">
            <div class="col form-group">
                <label>Select Staff Name:</label>
                <select id="staffName" onchange="autoFillStaffID()">
                    <option value="">-- Select Staff --</option>
                </select>
            </div>
            <div class="col form-group">
                <label>Employee ID:</label>
                <input type="text" id="staffID" readonly placeholder="Auto-filled">
            </div>
        </div>

        <!-- Custom Staff Name Input (When 'Other' is selected) -->
        <div class="row" id="otherStaffRow" style="display: none; margin-top: -4px;">
            <div class="col form-group">
                <label>Enter Name (Other):</label>
                <input type="text" id="customStaffName" placeholder="Full Name">
            </div>
            <div class="col form-group">
                <label>Enter ID (Other):</label>
                <input type="text" id="customStaffID" placeholder="e.g. 13">
            </div>
        </div>

        <div class="form-group">
            <label>Contact Phone:</label>
            <input type="text" id="telNo" placeholder="e.g. 012-3456789">
        </div>

        <div class="row">
            <div class="col form-group">
                <label>Address While on Leave:</label>
                <textarea id="contactWhileLeave" placeholder="Address during leave"></textarea>
            </div>
            <div class="col form-group">
                <label>Reason for Leave:</label>
                <textarea id="leaveReason" placeholder="Reason"></textarea>
            </div>
        </div>

        <div class="table-responsive">
            <table class="leave-table">
                <thead>
                    <tr>
                        <th style="width: 28%;">TYPE</th>
                        <th>FROM</th>
                        <th>TO</th>
                        <th style="width: 18%;">DAYS</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: left;"><input type="checkbox" id="annualCb"> Annual</td>
                        <td><input type="date" id="annualFrom" onchange="calculateDays('annual')"></td>
                        <td><input type="date" id="annualTo" onchange="calculateDays('annual')"></td>
                        <td><input type="number" id="annualDays" readonly placeholder="0"></td>
                    </tr>
                    <tr>
                        <td style="text-align: left;"><input type="checkbox" id="mcCb"> Medical</td>
                        <td><input type="date" id="mcFrom" onchange="calculateDays('mc')"></td>
                        <td><input type="date" id="mcTo" onchange="calculateDays('mc')"></td>
                        <td><input type="number" id="mcDays" readonly placeholder="0"></td>
                    </tr>
                    <tr>
                        <td style="text-align: left;"><input type="checkbox" id="elCb"> Emergency</td>
                        <td><input type="date" id="elFrom" onchange="calculateDays('el')"></td>
                        <td><input type="date" id="elTo" onchange="calculateDays('el')"></td>
                        <td><input type="number" id="elDays" readonly placeholder="0"></td>
                    </tr>
                    <tr>
                        <td style="text-align: left;"><input type="checkbox" id="otherCb"> Other Leave</td>
                        <td><input type="date" id="otherFrom" onchange="calculateDays('other')"></td>
                        <td><input type="date" id="otherTo" onchange="calculateDays('other')"></td>
                        <td><input type="number" id="otherDays" readonly placeholder="0"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="row">
            <div class="col form-group">
                <label>Signature:</label>
                <canvas id="sigCanvas"></canvas>
                <button type="button" class="btn-clear" onclick="clearSignature()">Clear</button>
            </div>
            <div class="col form-group">
                <label>Re-joining Date:</label>
                <input type="date" id="rejoiningDate">
            </div>
        </div>

        <div class="attached-preview" id="attachArea">
            <span id="noFileMsg" style="color:#64748b; font-size:8pt;">No Document attached.</span>
            <img id="previewImg" src="" alt="Attachment">
        </div>

        <div class="approved-section" id="approvedSection">
            <div class="approved-title">✅ Approved Leave Schedule</div>
            <div class="table-responsive">
                <table class="approved-table">
                    <thead>
                        <tr>
                            <th>Staff Name</th>
                            <th>Leave Dates</th>
                            <th>Type</th>
                        </tr>
                    </thead>
                    <tbody id="approvedTableBody">
                        <tr><td colspan="3" style="color:#64748b;">Loading approved schedule...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="app-footer">
    <div style="margin-bottom: 8px;">
        <label style="font-size: 8.5pt; font-weight: bold; color: #334155;">📎 Attach MC / Document:</label>
        <input type="file" id="fileAttachment" accept="image/*" onchange="previewFile()" style="font-size: 8.5pt; margin-top:4px; color: #475569;">
    </div>

    <div class="btn-group">
        <button class="btn btn-pdf" onclick="generatePDF()">📄 Download / Print PDF</button>
        <button class="btn btn-wa" onclick="sendToCinemaManager()">💬 Send to Manager</button>
    </div>

    <div>
        <a href="app-release.apk" download="app-release.apk" class="btn btn-apk">
            🤖 Download App for Android Users Only (APK)
        </a>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybsWr-b7kIzc2ITshxZKWVfsdvh9l1CsCn4qiWvWUFaBgPdTgRYdm1wmBaVkIT86E/exec";

    const staffDatabase = {
        "Perling Mall": [
            { id: "1", name: "Ainaa" },
            { id: "2", name: "Haldi" },
            { id: "3", name: "George" },
            { id: "4", name: "Sharrvin" },
            { id: "5", name: "Jayanath" },
            { id: "6", name: "Perry" },
            { id: "7", name: "Kumar" },
            { id: "8", name: "Alin" },
            { id: "9", name: "Bella" },
            { id: "10", name: "Maha" },
            { id: "11", name: "Rafie" },
            { id: "12", name: "Ran(PT)" },
            { id: "other", name: "Other" }
        ],
        "Pelangi Leisure Mall": [
            { id: "1", name: "Kimi" },
            { id: "2", name: "Lala" },
            { id: "3", name: "Krish" },
            { id: "4", name: "Suha" },
            { id: "5", name: "Atul" },
            { id: "other", name: "Other" }
        ]
    };

    function updateStaffList() {
        var branch = document.getElementById('cinemaBranch').value;
        var staffSelect = document.getElementById('staffName');
        staffSelect.innerHTML = '<option value="">-- Select Staff --</option>';
        
        if (staffDatabase[branch]) {
            staffDatabase[branch].forEach(function(staff) {
                var opt = document.createElement('option');
                opt.value = staff.name;
                opt.setAttribute('data-id', staff.id);
                opt.innerText = (staff.id === "other") ? "-- Other (Type Name) --" : staff.name + " (ID: " + staff.id + ")";
                staffSelect.appendChild(opt);
            });
        }
        document.getElementById('staffID').value = '';
        document.getElementById('otherStaffRow').style.display = 'none';
    }

    function autoFillStaffID() {
        var staffSelect = document.getElementById('staffName');
        var selectedOpt = staffSelect.options[staffSelect.selectedIndex];
        var staffID = selectedOpt.getAttribute('data-id') || '';
        var otherRow = document.getElementById('otherStaffRow');

        if (staffSelect.value === "Other") {
            otherRow.style.display = 'flex';
            document.getElementById('staffID').value = '';
            document.getElementById('staffID').removeAttribute('readonly');
        } else {
            otherRow.style.display = 'none';
            document.getElementById('staffID').value = staffID;
            document.getElementById('staffID').setAttribute('readonly', 'readonly');
        }
    }

    function getSelectedStaffName() {
        var staffSelect = document.getElementById('staffName').value;
        if (staffSelect === "Other") {
            return document.getElementById('customStaffName').value || 'Staff';
        }
        return staffSelect || 'Staff';
    }

    function getSelectedStaffID() {
        var staffSelect = document.getElementById('staffName').value;
        if (staffSelect === "Other") {
            return document.getElementById('customStaffID').value || 'N/A';
        }
        return document.getElementById('staffID').value || 'N/A';
    }

    var canvas = document.getElementById('sigCanvas');
    var ctx = canvas.getContext('2d');
    var isDrawing = false;
    ctx.strokeStyle = "#0284c7"; ctx.lineWidth = 2;

    function resizeCanvas() {
